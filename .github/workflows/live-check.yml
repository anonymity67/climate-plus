name: Live check
on:
  push:
    branches: [live-check]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node .github/live/check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-shots
          path: shots
