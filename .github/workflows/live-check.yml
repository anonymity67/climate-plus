name: Live check
on:
  push:
    branches: [live-check]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node .github/live/check.js
      - if: always()
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -f shots && git commit -m "live screenshots [skip ci]" && git push
