</defs><text x="40.0" y="50.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal">INTEGRATED RAINWATER HARVESTING — SYSTEM PROCESS SCHEMATIC</text><text x="40.0" y="72.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">One process train serves all three tiers. Capacities change; the treatment logic does not.</text><text x="40.0" y="104.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" text-anchor="start" font-weight="700" font-style="normal">①  CATCHMENT &amp; CONVEYANCE</text><rect x="40.0" y="112.0" width="200.0" height="50.0" rx="4" fill="#f3e2c7" stroke="#1a1a1a" stroke-width="1.4"/><text x="140.0" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">ROOF CATCHMENT</text><text x="140.0" y="149.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">GI / tile / asbestos</text><text x="40.0" y="178.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T1 20 m² · T2 160 m² · T3 600 m²</text><text x="40.0" y="191.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">Runoff coefficient 0.80</text><rect x="266.0" y="112.0" width="196.0" height="50.0" rx="4" fill="#f3e2c7" stroke="#1a1a1a" stroke-width="1.4"/><text x="364.0" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">GUTTER + LEAF SCREEN</text><text x="364.0" y="149.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">half-round, 1:200 fall</text><text x="266.0" y="178.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T1 Ø75 · T2 Ø150 · T3 Ø250</text><rect x="488.0" y="112.0" width="190.0" height="50.0" rx="4" fill="#f3e2c7" stroke="#1a1a1a" stroke-width="1.4"/><text x="583.0" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">DOWNPIPE</text><text x="583.0" y="149.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">uPVC Class 5</text><text x="488.0" y="178.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T1 Ø50 · T2 4×Ø50 · T3 8×Ø63</text><rect x="704.0" y="112.0" width="250.0" height="50.0" rx="4" fill="#fde7e4" stroke="#1a1a1a" stroke-width="1.4"/><text x="829.0" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">FIRST-FLUSH DIVERTER</text><text x="829.0" y="149.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">self-emptying, float-ball reset</text><text x="704.0" y="178.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">Discards first 1.5 mm of rain:</text><text x="704.0" y="191.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T1 30 L · T2 180 L · T3 600 L</text><line x1="240" y1="137" x2="262" y2="137" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><line x1="462" y1="137" x2="484" y2="137" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><line x1="678" y1="137" x2="700" y2="137" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><text x="40.0" y="232.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" text-anchor="start" font-weight="700" font-style="normal">②  PRE-TREATMENT</text><rect x="430.0" y="240.0" width="235.0" height="54.0" rx="4" fill="#cfe3d4" stroke="#1a1a1a" stroke-width="1.4"/><text x="547.5" y="260.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">PRE-FILTER</text><text x="547.5" y="277.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">gravel → coarse sand → charcoal</text><text x="430.0" y="310.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">removes leaves, grit, colour and</text><text x="430.0" y="323.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">organics; backwashable</text><rect x="690.0" y="240.0" width="205.0" height="54.0" rx="4" fill="#cfe3d4" stroke="#1a1a1a" stroke-width="1.4"/><text x="792.5" y="260.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">CASCADE AERATOR</text><text x="792.5" y="277.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">at the tank inlet</text><text x="690.0" y="310.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">adds oxygen, strips volatiles</text><polyline points="829.0,162.0 829.0,212.0 547.0,212.0" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round"/><polygon points="547,212 555,208 555,216" fill="#0b5fa5"/><line x1="665" y1="267" x2="686" y2="267" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><text x="40.0" y="364.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" text-anchor="start" font-weight="700" font-style="normal">③  STORAGE  —  sealed, covered, mosquito-proof, drawn from a floating or calmed inlet</text><polyline points="792.0,294.0 792.0,340.0 1118.0,340.0" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round"/><polygon points="1118,340 1110,336 1110,344" fill="#0b5fa5"/><rect x="1120.0" y="352.0" width="190.0" height="150.0" rx="2" fill="#e8f1f8" stroke="#1a1a1a" stroke-width="2"/><rect x="1128.0" y="374.0" width="174.0" height="120.0" rx="0" fill="url(#hwater)" stroke="none" stroke-width="0"/><line x1="1128.0" y1="374.0" x2="1302.0" y2="374.0" stroke="#5b8fc0" stroke-width="1.3" stroke-linecap="butt"/><rect x="1154.0" y="344.0" width="12.0" height="30.0" rx="0" fill="#cfd8dc" stroke="#1a1a1a" stroke-width="1.2"/><text x="1215.0" y="520.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">STORAGE TANK</text><text x="1215.0" y="535.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">T1 5,000 L  ·  T2 30,000 L  ·  T3 60,000 L</text><line x1="1123.0" y1="484.0" x2="930.0" y2="590.0" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="butt"/><circle cx="1123.0" cy="484.0" r="2.6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0"/><text x="926.0" y="587.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="#1e6b4f" font-weight="400" font-style="normal">sump / sediment trap — base falls 1% to a drain valve, cleaned annually</text><line x1="1128.0" y1="382.0" x2="1000.0" y2="338.0" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="butt"/><circle cx="1128.0" cy="382.0" r="2.6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0"/><text x="996.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="#1e6b4f" font-weight="400" font-style="normal">calmed inlet: no turbulence to re-suspend sediment</text><text x="40.0" y="596.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" text-anchor="start" font-weight="700" font-style="normal">④  DISINFECTION &amp; DISTRIBUTION</text><polyline points="1280.0,502.0 1280.0,578.0 360.0,578.0 360.0,600.0" fill="none" stroke="#0b5fa5" stroke-width="1.5" stroke-linejoin="round"/><polygon points="360,604 356,596 364,596" fill="#0b5fa5"/><rect x="360.0" y="604.0" width="208.0" height="58.0" rx="4" fill="#e8eef7" stroke="#1a1a1a" stroke-width="1.4"/><text x="464.0" y="624.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">CHLORINATION</text><text x="464.0" y="641.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">Ca-hypochlorite 65% · 0.2–0.5 mg/L</text><text x="360.0" y="678.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T1 dropper bottle · T2 constant-head</text><text x="360.0" y="691.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">T3 flow-proportional hypochlorinator</text><rect x="592.0" y="604.0" width="190.0" height="58.0" rx="4" fill="#e8eef7" stroke="#1a1a1a" stroke-width="1.4"/><text x="687.0" y="624.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">TAPSTAND</text><text x="687.0" y="641.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">2–4 taps, apron, drainage</text><text x="592.0" y="678.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">sited with women&#x27;s agreement</text><rect x="806.0" y="604.0" width="210.0" height="58.0" rx="4" fill="#e8eef7" stroke="#1a1a1a" stroke-width="1.4"/><text x="911.0" y="624.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="normal">POTABLE POINT</text><text x="911.0" y="641.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">ceramic candle filter</text><text x="806.0" y="678.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">drinking water only; candles</text><text x="806.0" y="691.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">renewed every 12–18 months</text><line x1="568" y1="633" x2="588" y2="633" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><line x1="782" y1="633" x2="802" y2="633" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arw)"/><text x="40.0" y="696.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e6b4f" text-anchor="start" font-weight="700" font-style="normal">⑤  INTEGRATED OVERFLOW  —  the surplus is an asset, not waste</text><polyline points="1298.0,502.0 1298.0,734.0 1010.0,734.0" fill="none" stroke="#1e6b4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="1006,734 1014,730 1014,738" fill="#1e6b4f"/><text x="1314.0" y="554.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1e6b4f" text-anchor="start" font-weight="400" font-style="normal" transform="rotate(-90 1314.0 554.0)">overflow</text><rect x="40.0" y="706.0" width="966.0" height="58.0" rx="4" fill="#dcece2" stroke="#1e6b4f" stroke-width="1.5"/><text x="201.0" y="731.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#1e6b4f" text-anchor="middle" font-weight="700" font-style="normal">MAR RECHARGE PIT</text><text x="201.0" y="749.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">soak pit 1.0–1.5 m Ø × 2.2 m deep</text><line x1="362.0" y1="710.0" x2="362.0" y2="760.0" stroke="#1e6b4f" stroke-width="0.8" stroke-linecap="butt"/><text x="523.0" y="731.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#1e6b4f" text-anchor="middle" font-weight="700" font-style="normal">RECHARGE WELL</text><text x="523.0" y="749.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">75 mm slotted uPVC to 8 m, where aquifer &lt; 10 m</text><line x1="684.0" y1="710.0" x2="684.0" y2="760.0" stroke="#1e6b4f" stroke-width="0.8" stroke-linecap="butt"/><text x="845.0" y="731.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#1e6b4f" text-anchor="middle" font-weight="700" font-style="normal">KITCHEN GARDEN</text><text x="845.0" y="749.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="400" font-style="normal">irrigation + livestock, year-round vegetables</text><text x="40.0" y="792.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1e6b4f" text-anchor="start" font-weight="400" font-style="normal">Why integrated:  the same structure delivers drinking water, recharges the shallow aquifer households fall back on in the dry season, and produces garden water.</text><text x="40.0" y="812.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1e6b4f" text-anchor="start" font-weight="700" font-style="normal">No RWH tank in coastal Bangladesh covers twelve months from roof capture alone. The recharge pit is what turns the overflow into that second source.</text><rect x="18.0" y="18.0" width="1464.0" height="844.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="23.0" y="23.0" width="1454.0" height="834.0" rx="0" fill="none" stroke="#1a1a1a" stroke-width="0.7"/><rect x="1052.0" y="766.0" width="430.0" height="96.0" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><line x1="1052.0" y1="800.0" x2="1482.0" y2="800.0" stroke="#1a1a1a" stroke-width="1" stroke-linecap="butt"/><line x1="1052.0" y1="830.0" x2="1482.0" y2="830.0" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="butt"/><line x1="1302.0" y1="800.0" x2="1302.0" y2="862.0" stroke="#1a1a1a" stroke-width="0.8" stroke-linecap="butt"/><text x="1062.0" y="789.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="normal">D-01  INTEGRATED RWH — PROCESS SCHEMATIC</text><text x="1062.0" y="818.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">BORSHA-BANDHU INTEGRATED RWH SYSTEM</text><text x="1062.0" y="848.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">DISCIPLINE: CIVIL / PUBLIC HEALTH ENGINEERING</text><text x="1310.0" y="818.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="start" font-weight="400" font-style="normal">DWG No.</text><text x="1310.0" y="844.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" text-anchor="start" font-weight="700" font-style="normal">BB-D-01</text><text x="1474.0" y="818.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="end" font-weight="400" font-style="normal">A3</text><text x="1474.0" y="844.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="end" font-weight="400" font-style="normal">SCALE: AS NOTED</text></svg>